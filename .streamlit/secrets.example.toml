# Copy to secrets.toml locally, or paste into the hosting service's secret settings.
# Manual mode needs no key. Never commit secrets.toml.
OPENAI_API_KEY = ""
OPENAI_MODEL = "gpt-4.1"

# Community Cloud: restrict app visibility to invited viewers using the host's sharing controls.
# Railway/public hosts: configure OIDC and enable this gate BEFORE exposing the app.
AUTH_REQUIRED = false
ALLOWED_EMAILS = ""

# Example OIDC configuration for a provider that returns verified email claims:
# [auth]
# redirect_uri = "https://YOUR-APP-HOST/oauth2callback"
# cookie_secret = "GENERATE-A-LONG-RANDOM-SECRET"
# client_id = "YOUR-OIDC-CLIENT-ID"
# client_secret = "YOUR-OIDC-CLIENT-SECRET"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
